[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-cli-progress"
version = "0.1.0"
description = "Zero-dependency progress bars and spinners for Python CLIs."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "H. A. Alsaibai", email = "hussain.alsaibai@gmail.com"},
]
keywords = ["cli", "progress", "spinner", "tqdm", "zero-dep", "pure-python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-cli-progress"
Repository = "https://github.com/hussain-alsaibai/tiny-cli-progress"
Issues = "https://github.com/hussain-alsaibai/tiny-cli-progress/issues"

[tool.setuptools]
py-modules = ["tiny_cli_progress"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["."]
